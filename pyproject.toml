[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packlight"
version = "0.0.1"
description = "Gives an AI agent only the skills, tools and context a request needs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "D A Gurupriyan" }]
keywords = ["agents", "skills", "mcp", "claude-code", "codex", "context-engineering"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
packlight-scan = "packlight.registry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
